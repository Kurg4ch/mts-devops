- name: Disable swap
  command: swapoff -a

- name: Disable swap fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
   - overlay
   - br_netfilter

- name: Presist kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Configure K8s sysctl
  copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl
  command: sysctl --system

- name: Install common packages
  apt:
    name:
      - ca-certificates
      - curl
      - gpg
      - containerd
    state: present
    update_cache: true

- name: Create Containerd dir
  file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Configure containerd for Kubernetes
  copy:
    dest: /etc/containerd/config.toml
    content: |
      version = 2

      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
        SystemdCgroup = true
    mode: '0644'

- name: Enable and restart containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: restarted
